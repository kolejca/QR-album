<!DOCTYPE html>
<html lang="mk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Споделете ги вашите моменти</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #faf8f5;
        --gold: #b8956a;
        --gold-dark: #8f7352;
        --text: #3d3429;
        --muted: #6b6258;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Montserrat", system-ui, sans-serif;
        color: var(--text);
        background: var(--cream);
      }

      .hero {
        position: fixed;
        inset: 0;
        background: url("wedding-hero.png") center / cover no-repeat;
        z-index: 0;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(250, 248, 245, 0.92) 0%,
          rgba(250, 248, 245, 0.78) 45%,
          rgba(250, 248, 245, 0.55) 100%
        );
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .card {
        width: min(420px, 100%);
        text-align: center;
        padding: 40px 32px 36px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(184, 149, 106, 0.35);
        border-radius: 4px;
        box-shadow:
          0 24px 64px rgba(61, 52, 41, 0.08),
          0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        backdrop-filter: blur(8px);
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold-dark);
      }

      h1 {
        margin: 0 0 6px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 600;
        line-height: 1.15;
        color: var(--text);
      }

      .subtitle {
        margin: 0 0 28px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.25rem;
        font-style: italic;
        color: var(--muted);
      }

      .divider {
        width: 48px;
        height: 1px;
        margin: 0 auto 28px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .lead {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.65;
        color: var(--muted);
      }

      .qr-frame {
        display: inline-block;
        padding: 14px;
        background: #fff;
        border: 1px solid rgba(184, 149, 106, 0.45);
        box-shadow: 0 8px 24px rgba(61, 52, 41, 0.06);
      }

      #qr {
        display: block;
        width: 200px;
        height: 200px;
      }

      .scan-hint {
        margin: 20px 0 0;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gold-dark);
      }

      .url {
        margin-top: 16px;
        font-size: 10px;
        word-break: break-all;
        color: var(--muted);
        opacity: 0.85;
      }

      .footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(184, 149, 106, 0.2);
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="hero" aria-hidden="true"></div>
    <div class="page">
      <main class="card">
        <p class="eyebrow">Добредојде</p>
        <h1>Споделете ги<br />вашите моменти</h1>
        <p class="subtitle">Заеднички фотоалбум</p>
        <div class="divider"></div>
        <p class="lead">
          Скенирајте го QR кодот со телефонот, сликајте и вашите фотографии ќе се појават во
          албумот за сите гости.
        </p>
        <div class="qr-frame">
          <img id="qr" alt="QR код за фотоалбумот" width="200" height="200" />
        </div>
        <p class="scan-hint">Скенирај &amp; сликај</p>
        <div class="url" id="url"></div>
        <p class="footer" id="note"></p>
      </main>
    </div>

    <script>
      const albumUrl = "https://qralbum-rouge.vercel.app/album.html";
      document.getElementById("url").textContent = albumUrl;
      document.getElementById("qr").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=3d3429&bgcolor=ffffff&data=" +
        encodeURIComponent(albumUrl);
      document.getElementById("note").textContent =
        "Поставете ја оваа страница на маса или влез — гостите го скенираат кодот без апликација.";
    </script>
  </body>
</html>
