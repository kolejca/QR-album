<!DOCTYPE html>
<html lang="mk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MojQrApp</title>
    <style>
      :root {
        --bg: #0f1419;
        --card: #1a222c;
        --text: #f4f7fb;
        --muted: #9aa8b6;
        --accent: #208aef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #17324d 0%, var(--bg) 42%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      main {
        width: min(440px, 100%);
        background: var(--card);
        border: 1px solid #2a3644;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }

      #qr {
        display: block;
        width: 240px;
        height: 240px;
        margin: 0 auto 16px;
        background: #fff;
        border-radius: 16px;
        padding: 12px;
      }

      .url {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
        color: var(--accent);
      }

      .note {
        margin-top: 20px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MojQrApp</h1>
      <p>Скенирај го QR кодот со апликацијата. Ќе те пренасочи на оваа страна.</p>
      <img id="qr" alt="QR код за MojQrApp" width="240" height="240" />
      <div class="url" id="url"></div>
      <p class="note" id="note"></p>
    </main>

    <script>
      const pageUrl = window.location.href;
      document.getElementById("url").textContent = pageUrl;
      document.getElementById("qr").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=" +
        encodeURIComponent(pageUrl);

      const isLocalHost =
        window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

      document.getElementById("note").textContent = window.location.protocol === "file:"
        ? "Отвори ја страницава преку http:// (не како локален фајл), инаку телефонот нема да може да ја отвори."
        : isLocalHost
          ? "Отвори ја истата адреса со IP на компјутерот (не localhost), на пр. http://192.168.100.2:4173/ — инаку телефонот не може да ја отвори."
          : "Отвори ја оваа страница на компјутер, па скенирај го кодот од телефонот.";
    </script>
  </body>
</html>
