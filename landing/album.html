<!DOCTYPE html>
<html lang="mk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Фотоалбум</title>
    <style>
      :root {
        --bg: #0f1419;
        --card: #1a222c;
        --text: #f4f7fb;
        --muted: #9aa8b6;
        --accent: #208aef;
        --line: #2a3644;
        --gold: #b8956a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #17324d 0%, var(--bg) 42%);
        color: var(--text);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px;
        background: rgba(15, 20, 25, 0.92);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.03em;
      }

      p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .change-guest {
        margin-top: 6px;
        padding: 0;
        background: none;
        color: var(--gold);
        font-size: 12px;
        font-weight: 600;
      }

      main {
        width: min(720px, 100%);
        margin: 0 auto;
        padding: 16px;
      }

      .empty {
        margin: 48px 0;
        text-align: center;
        color: var(--muted);
        line-height: 1.5;
      }

      .album {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .guest-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .guest-title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--gold);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .camera {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #000;
        display: flex;
        flex-direction: column;
      }

      .camera[hidden] {
        display: none;
      }

      .camera video {
        flex: 1;
        width: 100%;
        object-fit: cover;
        background: #000;
      }

      .camera-actions {
        display: flex;
        gap: 12px;
        padding: 16px;
        background: rgba(15, 20, 25, 0.95);
      }

      .camera-actions button {
        flex: 1;
      }

      .camera-actions .ghost {
        background: transparent;
        border: 1px solid var(--line);
      }

      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: #0b1016;
      }

      figcaption {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        padding: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .author {
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .remove {
        background: transparent;
        color: #f4f7fb;
        padding: 6px 8px;
        font-size: 12px;
        font-weight: 600;
        flex-shrink: 0;
      }

      #status {
        min-height: 1.2em;
        margin: 0 0 12px;
        color: #ffb4b4;
        font-size: 14px;
      }

      .welcome {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(8, 12, 18, 0.88);
        backdrop-filter: blur(6px);
      }

      .welcome[hidden] {
        display: none;
      }

      .welcome-card {
        width: min(400px, 100%);
        padding: 28px 24px;
        border-radius: 20px;
        background: var(--card);
        border: 1px solid var(--line);
      }

      .welcome-card h2 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .welcome-card p {
        margin: 0 0 20px;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-bottom: 14px;
        font-size: 13px;
        color: var(--muted);
      }

      input {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #0f1419;
        color: var(--text);
        font: inherit;
      }

      .welcome-actions {
        margin-top: 8px;
      }

      .welcome-actions button {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="welcome" id="welcome">
      <form class="welcome-card" id="welcomeForm">
        <h2>Добредојде</h2>
        <p>Напиши го твоето име и презиме пред да сликаш. Ќе се прикажат кај секоја твоја фотографија.</p>
        <label>
          Име
          <input id="firstName" name="firstName" autocomplete="given-name" required maxlength="40" />
        </label>
        <label>
          Презиме
          <input id="lastName" name="lastName" autocomplete="family-name" required maxlength="40" />
        </label>
        <div class="welcome-actions">
          <button type="submit">Продолжи</button>
        </div>
      </form>
    </div>

    <header>
      <div>
        <h1>Фотоалбум</h1>
        <p id="count">Нема слики</p>
        <p id="guestLabel"></p>
        <button type="button" class="change-guest" id="changeGuest" hidden>Смени име</button>
      </div>
      <button type="button" id="shoot" disabled>Сликај</button>
    </header>

    <main>
      <p id="status"></p>
      <p class="empty" id="empty">Притисни „Сликај“ и дозволи ја камерата. Сликите од сите гости се појавуваат овде.</p>
      <div class="album" id="album"></div>
    </main>

    <div class="camera" id="cameraModal" hidden>
      <video id="cameraVideo" playsinline autoplay muted></video>
      <div class="camera-actions">
        <button type="button" class="ghost" id="cancelCamera">Откажи</button>
        <button type="button" id="captureCamera">Сними</button>
      </div>
    </div>

    <script>
      const GUEST_KEY = "qralbum-guest";
      const cameraModal = document.getElementById("cameraModal");
      const cameraVideo = document.getElementById("cameraVideo");
      const album = document.getElementById("album");
      const empty = document.getElementById("empty");
      const count = document.getElementById("count");
      const status = document.getElementById("status");
      const welcome = document.getElementById("welcome");
      const welcomeForm = document.getElementById("welcomeForm");
      const shootButton = document.getElementById("shoot");
      const guestLabel = document.getElementById("guestLabel");
      const changeGuest = document.getElementById("changeGuest");
      let knownSnapshot = null;
      let guest = null;
      let cameraStream = null;

      function loadGuest() {
        try {
          const saved = JSON.parse(localStorage.getItem(GUEST_KEY) || "null");
          if (saved && saved.firstName && saved.lastName) {
            return saved;
          }
        } catch {}
        return null;
      }

      function saveGuest(nextGuest) {
        guest = nextGuest;
        localStorage.setItem(GUEST_KEY, JSON.stringify(nextGuest));
        updateGuestUi();
      }

      function clearGuest() {
        guest = null;
        localStorage.removeItem(GUEST_KEY);
        updateGuestUi();
        welcome.hidden = false;
      }

      function updateGuestUi() {
        if (guest) {
          guestLabel.textContent = "Сликаш како: " + guest.firstName + " " + guest.lastName;
          changeGuest.hidden = false;
          shootButton.disabled = false;
          welcome.hidden = true;
          return;
        }
        guestLabel.textContent = "";
        changeGuest.hidden = true;
        shootButton.disabled = true;
        welcome.hidden = false;
      }

      function guestName(photo) {
        const full = ((photo.firstName || "") + " " + (photo.lastName || "")).trim();
        return full || "Гостин";
      }

      async function listPhotos() {
        const response = await fetch("/api/photos", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("list");
        }
        return response.json();
      }

      async function compressToJpeg(file) {
        const bitmap = await createImageBitmap(file);
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.72));
        if (!blob) {
          throw new Error("compress");
        }
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        });
      }

      async function savePhoto(file) {
        if (!guest) {
          throw new Error("guest");
        }
        const image = await compressToJpeg(file);
        const response = await fetch("/api/photos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image,
            firstName: guest.firstName,
            lastName: guest.lastName,
          }),
        });
        if (!response.ok) {
          throw new Error("save");
        }
        return response.json();
      }

      async function deletePhoto(id) {
        const response = await fetch("/api/photos?id=" + encodeURIComponent(id), { method: "DELETE" });
        if (!response.ok) {
          throw new Error("delete");
        }
      }

      function photoCount(total) {
        if (total === 0) {
          return "Нема слики";
        }
        if (total === 1) {
          return "1 слика";
        }
        return total + " слики";
      }

      function groupPhotos(photos) {
        const groups = new Map();
        for (const photo of photos) {
          const label = guestName(photo);
          if (!groups.has(label)) {
            groups.set(label, []);
          }
          groups.get(label).push(photo);
        }
        return groups;
      }

      function renderPhotoCard(photo) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.alt = "Слика од " + guestName(photo);
        image.src = photo.url;

        const caption = document.createElement("figcaption");
        const meta = document.createElement("div");
        meta.className = "meta";
        const time = document.createElement("span");
        time.textContent = new Date(photo.createdAt).toLocaleString("mk");
        meta.append(time);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "Избриши";
        remove.addEventListener("click", async () => {
          try {
            await deletePhoto(photo.id);
            knownSnapshot = null;
            await renderAlbum();
          } catch (error) {
            status.textContent = "Сликата не може да се избрише.";
          }
        });

        caption.append(meta, remove);
        figure.append(image, caption);
        return figure;
      }

      async function renderAlbum() {
        const photos = await listPhotos();
        const snapshot = JSON.stringify(photos);
        if (snapshot === knownSnapshot) {
          return;
        }
        knownSnapshot = snapshot;
        album.replaceChildren();
        empty.hidden = photos.length > 0;
        count.textContent = photoCount(photos.length);

        for (const [label, items] of groupPhotos(photos)) {
          const section = document.createElement("section");
          section.className = "guest-section";
          const title = document.createElement("h2");
          title.className = "guest-title";
          title.textContent = label;
          const grid = document.createElement("div");
          grid.className = "grid";
          for (const photo of items) {
            grid.append(renderPhotoCard(photo));
          }
          section.append(title, grid);
          album.append(section);
        }
      }

      async function openCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          status.textContent = "Камерата не е достапна на овој уред.";
          return;
        }
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
        cameraVideo.srcObject = cameraStream;
        cameraModal.hidden = false;
      }

      function closeCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach((track) => track.stop());
          cameraStream = null;
        }
        cameraVideo.srcObject = null;
        cameraModal.hidden = true;
      }

      async function capturePhoto() {
        const video = cameraVideo;
        if (!video.videoWidth) {
          throw new Error("camera");
        }
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.72));
        if (!blob) {
          throw new Error("capture");
        }
        return new File([blob], "photo.jpg", { type: "image/jpeg" });
      }

      welcomeForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        if (!firstName || !lastName) {
          return;
        }
        saveGuest({ firstName, lastName });
      });

      changeGuest.addEventListener("click", () => {
        document.getElementById("firstName").value = guest ? guest.firstName : "";
        document.getElementById("lastName").value = guest ? guest.lastName : "";
        clearGuest();
      });

      shootButton.addEventListener("click", async () => {
        if (!guest) {
          welcome.hidden = false;
          return;
        }
        status.textContent = "";
        try {
          await openCamera();
        } catch (error) {
          status.textContent = "Не може да се отвори камерата. Дозволи ја камерата во прелистувачот.";
        }
      });

      document.getElementById("cancelCamera").addEventListener("click", () => {
        closeCamera();
      });

      document.getElementById("captureCamera").addEventListener("click", async () => {
        status.textContent = "Се праќа сликата...";
        try {
          const file = await capturePhoto();
          closeCamera();
          await savePhoto(file);
          status.textContent = "";
          knownSnapshot = null;
          await renderAlbum();
        } catch (error) {
          closeCamera();
          status.textContent = "Сликата не може да се зачува. Обиди се повторно.";
        }
      });

      guest = loadGuest();
      updateGuestUi();
      if (guest) {
        document.getElementById("firstName").value = guest.firstName;
        document.getElementById("lastName").value = guest.lastName;
      }

      renderAlbum().catch(() => {
        status.textContent = "Албумот не може да се вчита. Освежи ја страницата.";
      });

      setInterval(() => {
        renderAlbum().catch(() => {});
      }, 3000);
    </script>
  </body>
</html>
